    <title>Certflow CCNP ENCOR Tracker — CCNP ENCOR 350-401 Study Progress</title>
    <!-- Resolve the theme before first paint so there is no palette flash.
         Mirrors normalizeTheme() in ThemeProvider, incl. legacy value migration. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('encor.theme');
          var themes = { copper: 1, midnight: 1, ocean: 1, meadow: 1 };
          if (!themes[t]) t = t === 'dark' ? 'midnight' : 'copper';
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'copper';
        }
      })();
    </script>
